name: Auto merge and promote

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
    branches: [dev, test, main]
  push:
    branches: [dev, test]

permissions:
  contents: write
  pull-requests: write

jobs:
  enable-auto-merge:
    if: github.event_name == 'pull_request_target' && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - name: Validate promotion path and enable gated merge
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          case "$BASE_BRANCH:$HEAD_BRANCH" in
            test:dev|main:test) ;;
            dev:dev|dev:test|dev:main)
              echo "::error::Protected promotion branches cannot be used as feature sources into dev."
              exit 1
              ;;
            dev:*) ;;
            *)
              echo "::error::Unsupported promotion path: $HEAD_BRANCH -> $BASE_BRANCH"
              exit 1
              ;;
          esac
          # GitHub performs the merge only after every required branch check
          # succeeds. A failed, cancelled, skipped, stale, or missing check
          # leaves the pull request open and unmerged.
          gh pr merge --auto --merge "$PR_URL"

  promote:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Open the next promotion and enable gated merge
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          case "$SOURCE" in
            dev) TARGET=test ;;
            test) TARGET=main ;;
            *) exit 0 ;;
          esac
          pr_url="$(gh pr list --repo "$REPOSITORY" --head "$SOURCE" --base "$TARGET" --state open --json url --jq '.[0].url // empty')"
          if [ -z "$pr_url" ]; then
            pr_url="$(gh pr create --repo "$REPOSITORY" --head "$SOURCE" --base "$TARGET" --title "Promote $SOURCE to $TARGET" --body "Automated promotion. Merge remains blocked until every required build, browser, security, and promotion check succeeds.")"
          fi
          gh pr merge --repo "$REPOSITORY" --auto --merge "$pr_url"
