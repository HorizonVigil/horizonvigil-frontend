name: Deploy to Cloud Run

on:
  push:
    branches: [main]
  pull_request:

env:
  PROJECT_ID: cloudops360
  REGION: us-central1
  SERVICE: frontend
  REPO: cloudops360

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
      # Matches the original cloudops360-1 monorepo's Cloudflare pipeline
      # exactly: it calls `npx vite build` directly (deploy-cloudflare.yml),
      # NOT `npm run build` -- the package.json build script is `tsc -b &&
      # vite build`, and tsc -b DOES still enforce full type-checking even
      # with noEmit:true in tsconfig (noEmit only suppresses output files,
      # not error checking). Calling vite build directly bypasses tsc -b
      # entirely, same as the original pipeline, and surfaces a batch of
      # pre-existing type errors across the app unrelated to this migration
      # (ConnectAwsAccountWizard, api.ts param types, missing vitest
      # devDependency for two test files). Real, worth fixing, but a
      # separate cleanup pass -- not gating this deploy on a check the
      # existing prod frontend has never had to pass.
      - run: npx vite build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

  deploy:
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      # Every VITE_* URL below is a Cloud Run service in this same migration.
      # Several logical frontend "services" share one backend repo/URL --
      # resources+containers, costManagement+costOptimization,
      # monitoring+alerts, users+organizationManagement+settings,
      # reports+customDashboards+overview -- each keeps its own distinct
      # /api/<name> route prefix inside the shared repo, so pointing multiple
      # VITE_* vars at the same base URL is correct, not a mistake.
      # Only connector-aws has real ported logic behind it right now; the
      # rest are skeletons (200 on /, 404 on real routes) until their own
      # ports land -- deploying the frontend now establishes the real prod
      # topology rather than waiting for every backend to be complete.
      - name: Build and push image
        env:
          DOCKER_BUILDKIT: "1"
        run: |
          IMAGE="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO }}/${{ env.SERVICE }}:${{ github.sha }}"
          docker build \
            --build-arg VITE_SUPABASE_URL="${{ secrets.VITE_SUPABASE_URL }}" \
            --build-arg VITE_SUPABASE_PUBLISHABLE_KEY="${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}" \
            --build-arg VITE_AWS_ACCOUNTS_API_URL="https://connector-aws-7yo5yw7xca-uc.a.run.app" \
            --build-arg VITE_GCP_ACCOUNTS_API_URL="https://connector-gcp-7yo5yw7xca-uc.a.run.app" \
            --build-arg VITE_RESOURCES_API_URL="https://resources-7yo5yw7xca-uc.a.run.app" \
            --build-arg VITE_CONTAINERS_API_URL="https://resources-7yo5yw7xca-uc.a.run.app" \
            --build-arg VITE_COST_MANAGEMENT_API_URL="https://cost-7yo5yw7xca-uc.a.run.app" \
            --build-arg VITE_COST_OPTIMIZATION_API_URL="https://cost-7yo5yw7xca-uc.a.run.app" \
            --build-arg VITE_VULNERABILITY_MANAGEMENT_API_URL="https://security-7yo5yw7xca-uc.a.run.app" \
            --build-arg VITE_MONITORING_API_URL="https://observability-7yo5yw7xca-uc.a.run.app" \
            --build-arg VITE_ALERTS_API_URL="https://observability-7yo5yw7xca-uc.a.run.app" \
            --build-arg VITE_USERS_API_URL="https://admin-7yo5yw7xca-uc.a.run.app" \
            --build-arg VITE_ORGANIZATION_MANAGEMENT_API_URL="https://admin-7yo5yw7xca-uc.a.run.app" \
            --build-arg VITE_SETTINGS_API_URL="https://admin-7yo5yw7xca-uc.a.run.app" \
            --build-arg VITE_AUTOMATION_API_URL="https://automation-7yo5yw7xca-uc.a.run.app" \
            --build-arg VITE_REPORTS_API_URL="https://reports-7yo5yw7xca-uc.a.run.app" \
            --build-arg VITE_CUSTOM_DASHBOARDS_API_URL="https://reports-7yo5yw7xca-uc.a.run.app" \
            --build-arg VITE_OVERVIEW_API_URL="https://reports-7yo5yw7xca-uc.a.run.app" \
            -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE }} \
            --image="${{ env.IMAGE }}" \
            --region=${{ env.REGION }} \
            --platform=managed \
            --allow-unauthenticated \
            --min-instances=0 \
            --max-instances=4 \
            --memory=256Mi

      - name: Show service URL
        run: gcloud run services describe ${{ env.SERVICE }} --region=${{ env.REGION }} --format='value(status.url)'

  deploy-test:
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      # Staging Supabase project (jhwaujnlgjlvixnvleqc) — publishable/anon
      # key, not a secret by design (same reasoning as every backend
      # service already hardcoding its own SUPABASE_ANON_KEY literal).
      - name: Build and push test image
        env:
          DOCKER_BUILDKIT: "1"
        run: |
          IMAGE="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO }}/${{ env.SERVICE }}-test:${{ github.sha }}"
          docker build \
            --build-arg VITE_SUPABASE_URL="https://jhwaujnlgjlvixnvleqc.supabase.co" \
            --build-arg VITE_SUPABASE_PUBLISHABLE_KEY="sb_publishable_baBKAWA0j4QkFYzbpJBM5Q_J4q-EXlP" \
            --build-arg VITE_AWS_ACCOUNTS_API_URL="https://connector-aws-test-7yo5yw7xca-uc.a.run.app" \
            --build-arg VITE_GCP_ACCOUNTS_API_URL="https://connector-gcp-test-7yo5yw7xca-uc.a.run.app" \
            --build-arg VITE_RESOURCES_API_URL="https://resources-test-7yo5yw7xca-uc.a.run.app" \
            --build-arg VITE_CONTAINERS_API_URL="https://resources-test-7yo5yw7xca-uc.a.run.app" \
            --build-arg VITE_COST_MANAGEMENT_API_URL="https://cost-test-7yo5yw7xca-uc.a.run.app" \
            --build-arg VITE_COST_OPTIMIZATION_API_URL="https://cost-test-7yo5yw7xca-uc.a.run.app" \
            --build-arg VITE_VULNERABILITY_MANAGEMENT_API_URL="https://security-test-7yo5yw7xca-uc.a.run.app" \
            --build-arg VITE_MONITORING_API_URL="https://observability-test-7yo5yw7xca-uc.a.run.app" \
            --build-arg VITE_ALERTS_API_URL="https://observability-test-7yo5yw7xca-uc.a.run.app" \
            --build-arg VITE_USERS_API_URL="https://admin-test-7yo5yw7xca-uc.a.run.app" \
            --build-arg VITE_ORGANIZATION_MANAGEMENT_API_URL="https://admin-test-7yo5yw7xca-uc.a.run.app" \
            --build-arg VITE_SETTINGS_API_URL="https://admin-test-7yo5yw7xca-uc.a.run.app" \
            --build-arg VITE_AUTOMATION_API_URL="https://automation-test-7yo5yw7xca-uc.a.run.app" \
            --build-arg VITE_REPORTS_API_URL="https://reports-test-7yo5yw7xca-uc.a.run.app" \
            --build-arg VITE_CUSTOM_DASHBOARDS_API_URL="https://reports-test-7yo5yw7xca-uc.a.run.app" \
            --build-arg VITE_OVERVIEW_API_URL="https://reports-test-7yo5yw7xca-uc.a.run.app" \
            -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Deploy test env to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE }}-test \
            --image="${{ env.IMAGE }}" \
            --region=${{ env.REGION }} \
            --platform=managed \
            --allow-unauthenticated \
            --min-instances=0 \
            --max-instances=4 \
            --memory=256Mi

      - name: Show test service URL
        run: gcloud run services describe ${{ env.SERVICE }}-test --region=${{ env.REGION }} --format='value(status.url)'
