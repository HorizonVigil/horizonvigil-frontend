name: Deploy to Cloud Run

on:
  push:
    branches: [main, test]
  pull_request:

env:
  PROJECT_ID: cloudops360
  REGION: us-central1
  SERVICE: frontend
  REPO: cloudops360

jobs:
  # This job was named build-and-test while only ever running `npm run build`.
  # 635 unit tests, a typecheck and (since this change) a lint step existed in
  # the repository and none of them gated a deploy: a push that broke every
  # test still shipped, because the only thing standing between main and
  # production was whether Vite could emit a bundle.
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit and component tests
        run: npm test

      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

      # Unauthenticated browser smoke tests. These need no credentials and no
      # deployed environment -- Playwright builds and serves `dist` itself --
      # so unlike the authenticated suite they can gate every push. They are
      # what catches a code-split chunk that fails to load, which no unit test
      # can see because unit tests never mount the router.
      - name: Install Playwright browser
        run: npx playwright install chromium --with-deps

      - name: Browser smoke tests (unauthenticated)
        run: npx playwright test --project=public
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  deploy:
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      # Every VITE_* URL below is a Cloud Run service in this same migration.
      # Several logical frontend "services" share one backend repo/URL --
      # resources+containers, costManagement+costOptimization,
      # monitoring+alerts, users+organizationManagement+settings,
      # reports+customDashboards+overview -- each keeps its own distinct
      # /api/<name> route prefix inside the shared repo, so pointing multiple
      # VITE_* vars at the same base URL is correct, not a mistake.
      # Only connector-aws has real ported logic behind it right now; the
      # rest are skeletons (200 on /, 404 on real routes) until their own
      # ports land -- deploying the frontend now establishes the real prod
      # topology rather than waiting for every backend to be complete.
      - name: Build and push image
        env:
          DOCKER_BUILDKIT: "1"
        run: |
          IMAGE="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO }}/${{ env.SERVICE }}:${{ github.sha }}"
          docker build \
            --build-arg VITE_SUPABASE_URL="${{ secrets.VITE_SUPABASE_URL }}" \
            --build-arg VITE_SUPABASE_PUBLISHABLE_KEY="${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}" \
            --build-arg VITE_AWS_ACCOUNTS_API_URL="https://connector-aws-7yo5yw7xca-uc.a.run.app" \
            --build-arg VITE_GCP_ACCOUNTS_API_URL="https://connector-gcp-7yo5yw7xca-uc.a.run.app" \
            --build-arg VITE_RESOURCES_API_URL="https://resources-7yo5yw7xca-uc.a.run.app" \
            --build-arg VITE_CONTAINERS_API_URL="https://resources-7yo5yw7xca-uc.a.run.app" \
            --build-arg VITE_COST_MANAGEMENT_API_URL="https://cost-7yo5yw7xca-uc.a.run.app" \
            --build-arg VITE_COST_OPTIMIZATION_API_URL="https://cost-7yo5yw7xca-uc.a.run.app" \
            --build-arg VITE_VULNERABILITY_MANAGEMENT_API_URL="https://security-7yo5yw7xca-uc.a.run.app" \
            --build-arg VITE_MONITORING_API_URL="https://observability-7yo5yw7xca-uc.a.run.app" \
            --build-arg VITE_ALERTS_API_URL="https://observability-7yo5yw7xca-uc.a.run.app" \
            --build-arg VITE_USERS_API_URL="https://admin-7yo5yw7xca-uc.a.run.app" \
            --build-arg VITE_ORGANIZATION_MANAGEMENT_API_URL="https://admin-7yo5yw7xca-uc.a.run.app" \
            --build-arg VITE_SETTINGS_API_URL="https://admin-7yo5yw7xca-uc.a.run.app" \
            --build-arg VITE_AUTOMATION_API_URL="https://automation-7yo5yw7xca-uc.a.run.app" \
            --build-arg VITE_REPORTS_API_URL="https://reports-7yo5yw7xca-uc.a.run.app" \
            --build-arg VITE_CUSTOM_DASHBOARDS_API_URL="https://reports-7yo5yw7xca-uc.a.run.app" \
            --build-arg VITE_OVERVIEW_API_URL="https://reports-7yo5yw7xca-uc.a.run.app" \
            --build-arg VITE_BILLING_API_URL="https://billing-7yo5yw7xca-uc.a.run.app" \
            -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE }} \
            --image="${{ env.IMAGE }}" \
            --region=${{ env.REGION }} \
            --platform=managed \
            --allow-unauthenticated \
            --min-instances=0 \
            --max-instances=4 \
            --memory=256Mi

      - name: Show service URL
        run: gcloud run services describe ${{ env.SERVICE }} --region=${{ env.REGION }} --format='value(status.url)'

  # ── POST-DEPLOY AUTHENTICATED GATE ──────────────────────────────────────
  #
  # Runs AFTER the revision is live and drives the REAL logged-in product
  # against it. A deploy does not stand on its own: if the authenticated
  # suite fails here, this workflow fails, the revision is marked bad, and
  # the failure is attributable to the exact commit that shipped it.
  #
  # It runs post-deploy rather than pre-deploy on purpose. Running it before
  # would test the PREVIOUS revision and prove nothing about the one being
  # shipped.
  #
  # Missing credentials FAIL this job. They never downgrade it to a skip:
  # a green deploy whose authenticated gate quietly did not run is the exact
  # condition that left this suite at zero executions for months.
  post-deploy-smoke:
    needs: deploy
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Verify smoke-test credentials are configured
        env:
          SMOKE_TEST_EMAIL: ${{ secrets.SMOKE_TEST_EMAIL }}
          SMOKE_TEST_PASSWORD: ${{ secrets.SMOKE_TEST_PASSWORD }}
        run: |
          set -eu
          if [ -z "${SMOKE_TEST_EMAIL:-}" ] || [ -z "${SMOKE_TEST_PASSWORD:-}" ]; then
            echo "::error::AUTHENTICATED E2E CONFIGURATION ERROR - smoke-test credentials are not configured"
            exit 1
          fi
          echo "Smoke-test credentials are present."

      - name: Authenticated smoke tests against the deployed revision
        env:
          SMOKE_TEST_EMAIL: ${{ secrets.SMOKE_TEST_EMAIL }}
          SMOKE_TEST_PASSWORD: ${{ secrets.SMOKE_TEST_PASSWORD }}
        run: |
          set -eu
          npx playwright test --project=smoke --list > discovered.txt 2>&1
          count="$(grep -c '› ' discovered.txt || true)"
          echo "AUTHENTICATED TESTS DISCOVERED: ${count}"
          if [ "${count:-0}" -lt 1 ]; then
            echo "::error::Zero authenticated tests discovered - the suite has become empty"
            exit 1
          fi
          npx playwright test --project=smoke

      # Safe to publish: the setup project (the only place a password is
      # typed) records no trace, screenshot or video. See playwright.config.ts.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: post-deploy-playwright-report
          path: playwright-report/
          retention-days: 14

  # Genuinely separate test environment: its own GCP project
  # (cloudops360-test, own CPU quota) and its own Supabase project
  # (staging) for auth and every backend it talks to, not just billing.
  # Deployed as a plain "frontend" service inside that project -- no name
  # collision risk since prod lives in a different project entirely.
  deploy-test:
    needs: build-and-test
    if: github.ref == 'refs/heads/test' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PROJECT_ID: cloudops360-test
      SERVICE: frontend
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY_TEST }}

      - uses: google-github-actions/setup-gcloud@v2

      - run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build and push image
        env:
          DOCKER_BUILDKIT: "1"
        run: |
          IMAGE="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO }}/${{ env.SERVICE }}:${{ github.sha }}"
          docker build \
            --build-arg VITE_SUPABASE_URL="https://jhwaujnlgjlvixnvleqc.supabase.co" \
            --build-arg VITE_SUPABASE_PUBLISHABLE_KEY="sb_publishable_baBKAWA0j4QkFYzbpJBM5Q_J4q-EXlP" \
            --build-arg VITE_AWS_ACCOUNTS_API_URL="https://connector-aws-975304691244.us-central1.run.app" \
            --build-arg VITE_GCP_ACCOUNTS_API_URL="https://connector-gcp-975304691244.us-central1.run.app" \
            --build-arg VITE_RESOURCES_API_URL="https://resources-975304691244.us-central1.run.app" \
            --build-arg VITE_CONTAINERS_API_URL="https://resources-975304691244.us-central1.run.app" \
            --build-arg VITE_COST_MANAGEMENT_API_URL="https://cost-975304691244.us-central1.run.app" \
            --build-arg VITE_COST_OPTIMIZATION_API_URL="https://cost-975304691244.us-central1.run.app" \
            --build-arg VITE_VULNERABILITY_MANAGEMENT_API_URL="https://security-975304691244.us-central1.run.app" \
            --build-arg VITE_MONITORING_API_URL="https://observability-975304691244.us-central1.run.app" \
            --build-arg VITE_ALERTS_API_URL="https://observability-975304691244.us-central1.run.app" \
            --build-arg VITE_USERS_API_URL="https://admin-975304691244.us-central1.run.app" \
            --build-arg VITE_ORGANIZATION_MANAGEMENT_API_URL="https://admin-975304691244.us-central1.run.app" \
            --build-arg VITE_SETTINGS_API_URL="https://admin-975304691244.us-central1.run.app" \
            --build-arg VITE_AUTOMATION_API_URL="https://automation-975304691244.us-central1.run.app" \
            --build-arg VITE_REPORTS_API_URL="https://reports-975304691244.us-central1.run.app" \
            --build-arg VITE_CUSTOM_DASHBOARDS_API_URL="https://reports-975304691244.us-central1.run.app" \
            --build-arg VITE_OVERVIEW_API_URL="https://reports-975304691244.us-central1.run.app" \
            --build-arg VITE_BILLING_API_URL="https://billing-975304691244.us-central1.run.app" \
            -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE }} \
            --image="${{ env.IMAGE }}" \
            --region=${{ env.REGION }} \
            --project=${{ env.PROJECT_ID }} \
            --platform=managed \
            --allow-unauthenticated \
            --min-instances=0 \
            --max-instances=4 \
            --memory=256Mi

      - name: Show service URL
        run: gcloud run services describe ${{ env.SERVICE }} --region=${{ env.REGION }} --project=${{ env.PROJECT_ID }} --format='value(status.url)'
