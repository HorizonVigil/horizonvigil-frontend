name: Go-Live Smoke Test

# Manual only (workflow_dispatch), not on every push -- this suite logs
# into a real account in a real org and clicks through real pages against
# whatever SMOKE_TEST_BASE_URL points at (production by default). Run it
# before every production release, per the audit's "Recommended 36-Day
# Sequence" #3 and the master spec's own §46.
on:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Frontend URL to test (defaults to production)'
        required: false
        type: string

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          SMOKE_TEST_BASE_URL: ${{ inputs.base_url || '' }}
          SMOKE_TEST_EMAIL: ${{ secrets.SMOKE_TEST_EMAIL }}
          SMOKE_TEST_PASSWORD: ${{ secrets.SMOKE_TEST_PASSWORD }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
