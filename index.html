<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Inventory, cost, security, and cloud operations unified across the AWS accounts and Google Cloud projects your team runs."
    />
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <title>HorizonVigil — One control plane for AWS and Google Cloud</title>

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="HorizonVigil" />
    <meta
      property="og:title"
      content="HorizonVigil — One control plane for AWS and Google Cloud"
    />
    <meta
      property="og:description"
      content="Inventory, cost, security, and cloud operations unified across the AWS accounts and Google Cloud projects your team runs."
    />
    <meta property="og:image" content="https://horizonvigil.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="HorizonVigil cloud operations platform" />
    <meta property="og:url" content="https://horizonvigil.com/" />

    <!-- X / Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="HorizonVigil — One control plane for AWS and Google Cloud"
    />
    <meta
      name="twitter:description"
      content="Inventory, cost, security, and cloud operations unified across the AWS accounts and Google Cloud projects your team runs."
    />
    <meta name="twitter:image" content="https://horizonvigil.com/og-image.png" />
    <meta name="twitter:image:alt" content="HorizonVigil cloud operations platform" />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://horizonvigil.com/" />

    <!-- Browser UI theme -->
    <meta
      name="theme-color"
      media="(prefers-color-scheme: light)"
      content="#f8fafc"
    />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: dark)"
      content="#0f172a"
    />

    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="/horizonvigil-icon.svg" />
    <link rel="alternate icon" href="/favicon.ico" />

    <!-- Font connections -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
    />
  </head>

  <body>
    <!--
      Applies the saved/preferred theme before React mounts to avoid a
      light-theme flash during dark-mode loads. Kept as an external script
      so a strict script-src 'self' CSP can allow it without an inline hash.
    -->
    <script src="/theme-init.js"></script>

    <div id="root"></div>

    <noscript>
      <p>
        HorizonVigil requires JavaScript to run the application.
      </p>
    </noscript>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
