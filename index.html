<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CloudOps360 — One control plane for AWS and Google Cloud</title>
    <meta name="description" content="Inventory, cost, security, and automated remediation, unified across every AWS account and GCP project your team runs." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="CloudOps360" />
    <meta property="og:title" content="CloudOps360 — One control plane for AWS and Google Cloud" />
    <meta property="og:description" content="Inventory, cost, security, and automated remediation, unified across every AWS account and GCP project your team runs." />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="CloudOps360 — One control plane for AWS and Google Cloud" />
    <meta name="twitter:description" content="Inventory, cost, security, and automated remediation, unified across every AWS account and GCP project your team runs." />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f8fafc" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0f172a" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 36 36'%3E%3Crect width='36' height='36' rx='8' fill='%231d63f5'/%3E%3Ctext x='18' y='25' font-family='system-ui,sans-serif' font-size='20' font-weight='700' fill='white' text-anchor='middle'%3EC%3C/text%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <!-- Applies the saved/preferred theme before React mounts, avoiding a
         flash of the light theme on a dark-mode load. -->
    <script>
      (function () {
        var stored = localStorage.getItem('cloudops360_theme');
        var dark = stored === 'dark' || (stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.classList.add('dark');
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
